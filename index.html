<!--
  STATIC BASELINE JSON-LD
  ========================
  Hand-authored snapshot of the "generic / safe" visitor state, kept in
  sync with content.js by hand. It exists so a visitor (or crawler) with
  JavaScript disabled still gets correct, approved structured data — this
  is a static file with no server, so a per-visitor JSON-LD can only be
  produced client-side. Once JS runs, core/jsonld.js rewrites this same
  <script> tag to match the active composition state.
-->
<script type="application/ld+json" id="ld-json">
[
  {
    "@context": "https://schema.org",
    "@type": "HomeAndConstructionBusiness",
    "name": "Anvaya",
    "legalName": "Anvaya Interiors Pvt Ltd",
    "url": "https://sayanrup.github.io/Anvaya/",
    "description": "Anvaya designs, manufactures and installs full home interiors across India, with fixed pricing confirmed before you commit, on-time delivery, and a written warranty on all work.",
    "areaServed": ["Bengaluru","Mumbai","Delhi","Noida","Gurugram","Ghaziabad","Faridabad","Pune","Hyderabad","Chennai","Kolkata","Ahmedabad","Surat","Vadodara","Rajkot","Jaipur","Lucknow","Kanpur","Chandigarh","Mohali","Ludhiana","Amritsar","Nagpur","Nashik","Indore","Bhopal","Coimbatore","Kochi","Thiruvananthapuram","Mysuru","Mangaluru","Visakhapatnam","Vijayawada","Guntur","Thane","Navi Mumbai","Dehradun","Bhubaneswar","Guwahati","Patna"]
  },
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "name": "Full home interior design & execution",
    "provider": { "@type": "Organization", "name": "Anvaya" },
    "areaServed": ["Bengaluru","Mumbai","Delhi","Noida","Patna"],
    "offers": {
      "@type": "Offer",
      "priceCurrency": "INR",
      "priceSpecification": {
        "@type": "PriceSpecification",
        "minPrice": 750000,
        "maxPrice": 1350000,
        "priceCurrency": "INR"
      },
      "description": "Illustrative starting range for planning only — not a quote. Your exact price depends on city, carpet area, and finish level, and is confirmed for free before you sign anything."
    }
  },
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "How much does a 3BHK home interior cost with Anvaya?", "acceptedAnswer": { "@type": "Answer", "text": "An illustrative starting range is ₹7.5L–₹13.5L for a full 3BHK; your exact price is confirmed for free before you commit, using Anvaya's Cost Calculator." } },
      { "@type": "Question", "name": "Is Anvaya available in my city?", "acceptedAnswer": { "@type": "Answer", "text": "Anvaya currently operates in 40 Indian cities, including Bengaluru, Mumbai, Delhi, Noida and Patna. Enter your city on this page for a direct yes/no." } },
      { "@type": "Question", "name": "Does Anvaya guarantee delivery dates?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Anvaya commits to an on-time delivery date in writing at the start of every project." } },
      { "@type": "Question", "name": "Is there a warranty on Anvaya interiors?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Every Anvaya project is backed by a written warranty covering workmanship and materials after handover." } },
      { "@type": "Question", "name": "How is Anvaya different from other interior providers?", "acceptedAnswer": { "@type": "Answer", "text": "Anvaya commits to fixed pricing in writing, on-time delivery, and a written warranty, with your exact cost confirmed free before you commit — rather than making comparative claims about any named competitor." } }
    ]
  }
]
</script>
</head>
